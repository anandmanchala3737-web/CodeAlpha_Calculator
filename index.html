<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Calculator</h1>
    <div class="calculator">
        <div class="main">
            <!-- <h1>Claculator</h1> -->
            <input type="text" for="Btn_sub" id="input_box" placeholder="0"   style="grid-area: input">
            
            <button id="Btn_sub" class="num_btn" style="grid-area: AC">AC</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: C">C</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: con">±</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: div">÷</button>

            <button id="Btn_sub" class="num_btn" style="grid-area: btn1">1</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn2">2</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn3">3</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn4">4</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn5">5</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn6">6</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn7">7</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn8">8</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn9">9</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: btn0">0</button>
        
            <button id="Btn_sub" class="num_btn" style="grid-area: mul">×</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: sub">−</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: add">+</button>
            <button id="Btn_sub" class="num_btn" style="grid-area: res">=</button>
        </div>
    </div>
    <script src="./calculator.js"></script>
</body>
</html>
